[project]
name = "groundwork-data-aggregator"
version = "0.1.0"
description = "Groundwork Data Aggregator as its own Mistral managed agent"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mistralai-agents[bashkit,sessions-client,koyeb]==1.1.3",
  # Groundwork runtime (the tools call backend.agent.tools / backend.scoring)
  "h3>=4.1,<5", "numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "scipy>=1.11", "shapely>=2.0",
  "pyproj>=3.6", "requests>=2.31", "pyyaml>=6.0", "pydantic>=2.5,<3", "lightgbm>=4.3",
  "scikit-learn>=1.4", "rasterio>=1.3", "pyshp>=2.3",
]

# A workspace of its own so `uv lock` writes uv.lock here, separate from the main project.
[tool.uv.workspace]
