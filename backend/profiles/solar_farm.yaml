id: solar_farm
label: Solar farm
description: >-
  Maximum sunshine on flat, cheap, low-density land with a nearby grid
  connection, avoiding flood plains and protected land. Panel output also falls
  in heat and cloud, so cooler, clearer sites score higher.
layers:
  solar_irradiance:      {weight: 0.20, better: higher}
  sunshine_hours:        {weight: 0.10, better: higher}
  cloud_cover_mean:      {weight: 0.05, better: lower}
  dist_substation:       {weight: 0.18, better: lower}
  slope:                 {weight: 0.12, better: lower}
  population_density:    {weight: 0.12, better: lower}
  median_house_price:    {weight: 0.08, better: lower}
  dist_hv_line:          {weight: 0.08, better: lower}
  summer_max_temp:       {weight: 0.04, better: lower}
  wind_gust_max:         {weight: 0.03, better: lower}
masks: [flood_zone_3, protected_land]
